<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부 CSS</title>
    <STYle>
        h1{color:blue;}
        #title{color:yellow;}
        #header{background-color: red;}
        .pink{background-color: pink;}
        p{color:aqua;}
        h1{color: green;}
        .point{color:deeppink;}
    </STYle>
</head>
<body>
    <!--div>h1+ul>li*3-->
    <div id="header">
        <h1 id="title">html5 기본</h1>
        <ul>
            <li>메뉴-1</li>
            <li class="point">메뉴-2</li>
            <li>메뉴-3</li>
        </ul>
    </div>
    <div class="pink">
        <h1>Lorem, ipsum dolor.</h1>
        <p>Lorem, ipsum dolor.</p>
    </div>
    <div class="pink">
        <h1>Lorem ipsum dolor sit.</h1>
        <p>Lorem ipsum dolor sit.</p>
    </div>
    <div>
        <span>서울특별시 강서구 내발산동</span>
        <span class="point">02-777-1234</span>
    </div>
</body>
</html>
