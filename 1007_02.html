<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스속성</title>
    <style>
        *{margin: 0;}
        h1{background-color: yellow; width: 120px;margin-left: 50px;margin-top: 50px;margin: 20px; margin: 20px 50px;margin: 30px 0 30 0px; padding: 30px;} 
        /* border는 두께,스타일,컬러가 필수*/ /*border 픽셀 스타일 컬러순으로 한줄에 정리 가능하다*/ /*margin은 움직이는 코드이다.*/ /*margin 하나만 적으면 전부다 두개쓰면 앞에는 상하 뒤에는 좌우이다*/ /*4개쓰면 위 우 하 좌 순서이다.*/
        h2{border: 5px solid blue;width: 100px;margin-top: 30px;}
    </style>
</head>
<body>
    <h1>박스속성</h1>
    <h2>박스2</h2>
</body>
</html>
