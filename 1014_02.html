<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수평 정렬</title>
    <style>
        *{margin: 0;padding: 0;} /*{margin: 0; padding: 0;}*/
        #wrap{border: 5px solid green; width: 500px; overflow: hidden; margin:0 auto;} /*#wrap{border: 5px solid green; width: 600px; overflow: hidden; margin:0 auto;}*/
        #box1{float: left; background-color: red; width: 150px; height: 100px;} /*#box1{float: left; background-color: red;width: 150px; height: 100px;}*/
        #box2{float: left; background-color: yellow; width: 150px; height: 100px;} /*#box2{float: left; background-color: yellow;width: 150px; height: 100px;}*/
        #box3{clear: both; float: left; background-color: blue; width: 150px; height: 100px;} /*#box3{clear: both; float: left; background-color: blue;width: 150px; height: 100px;}*/ 
    </style>
</head>
<body>
    <div id="wrap">
        <div id="box1"> <!--div*3#box$>h1{박스$}-->
            <h1>박스1</h1>
        </div>
        <div id="box2">
            <h1>박스2</h1>
        </div>
        <div id="box3">
            <h1>박스3</h1>
        </div>
    </div>
</body>
</html>
