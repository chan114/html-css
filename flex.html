<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-box</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        div{width: 500px; height: 500px; border: 5px solid gray; display: flex; justify-content: space-between; align-items: center;}
        p{width: 100px; height: 100px;}
        #box1{background-color: red; font-size: 2em;}
        #box2{background-color: yellow; font-size: 2em;}
        #box3{background-color: blue; font-size: 2rem;}
    </style>
</head>
<body>
    <div>
        <p id="box1">박스1</p>
        <p id="box2">박스2</p>
        <p id="box3">박스3</p>
    </div>
</body>
</html>
