<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공간분활태그</title>
</head>
<body>
    <!--내부 CSS-->
    <style>
        /*선택자{속성:속성값;}*/
        div{color: blue;}
        span{background-color: red;}
        h1{color:brown;
        background-color: yellow;}
        h1{color: green;}
    </style>
    <h1>제목태그</h1>
    <!--div*3{블록요소$}-->
    <div>블럭요소1</div>
    <div>블럭요소2</div>
    <div>블럭요소3</div>
    <!--span*3{인라인요소$}-->
    <span>인라인요소1</span>
    <span>인라인요소2</span>
    <span>인라인요소3</span>
    <!--p*3{문단태그$}-->
    <p>문단태그1</p>
    <p>문단태그2</p>
    <p>문단태그3</p>
    <!--a*3{링크태그$}-->
    <a href="">링크태그1</a>
    <a href="">링크태그2</a>
    <a href="">링크태그3</a>
</body>
</html>
