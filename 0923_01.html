<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중첩 목록 태그</title>
</head>
<body> 
    <!--순서가 없는 목록 ul-->
    <!--type속성의 속성값 disc,circle,square-->
    <ul type="square">
        <li>남자 MC</li>
        <ol>
            <li>유재석</li>
            <ul>
                <ul type="circle">
                    <li>유퀴즈</li>
                    <li>러닝맨</li>
                </ul>
            </ul>
            <li>전현무</li>
            <li>신동엽</li>
        </ol>
        <li>여자 걸그룹</li>
        <ol type="A">
            <li>블랙핑크</li>
            <li>레드벨벳</li>
        </ol>
    </ul>
</body>
</html>
