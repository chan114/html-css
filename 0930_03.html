<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이아웃</title>
    <style>
        #wrap{background-color: yellow;
        width: 300px;}
        #header{background-color: red;
        width: 500px;height: 100px;}
        #visual{background-color: pink;
        width: 500px;height: 100px;}
        #contents{background-color: blue;
        width: 500px;height: 100px;}
        #footer{background-color: skyblue;
        width: 500px;height: 100px;}
        .white{color: white;}
    </style>
</head>
<body>
    <div id="wrap">
        <div id="header">
            <h1 class="white">헤더영역</h1>
            <ul>
                <li>메뉴-01</li>
                <li>메뉴-02</li>
                <li>메뉴-03</li>
            </ul>
        </div>
        <div id="visual">
            <h1>비주얼영역</h1>
        </div>
        <div id="contents">
            <h1 class="white">컨텐츠영역</h1>
        </div>
        <div id="footer">
            <h1>푸터영역</h1>
        </div>
    </div>
</body>
</html>
