<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>one-true 레이아웃</title>
    <style>
        *{margin: 0; padding: 0;}
        #wrap{width: 780px; margin: 0 auto;
        border: 1px solid red}
        #top{overflow: hidden;}
        #box1{width: 200px; height: 100px; background-color: red; float: left; margin: 20px 0 0 20px;}
        #box2{width: 300px; height: 300px; background-color: yellow; float: left; margin: 20px;}
        #box3{width: 200px; height: 100px; background-color: blue; float: left; margin-top: 20px;}
        #bottom{width: 780px; height: 100px; background-color: green;}
    </style>
</head>
<body>
    <div id="wrap">
        <div id="top">
            <div id="box1">영역1</div>
            <div id="box2">영역2</div>
            <div id="box3">영역3</div>
        </div>

        <div id="bottom">
            영역4
        </div>
    </div>
</body>
</html>
