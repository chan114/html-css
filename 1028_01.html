<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /*초기화*/
       *{margin:0; padding: 0;}
       /*브라우저 중앙정렬*/
       #wrap{width: 500px; margin: 0 auto; 
        border: 1px solid red; overflow: hidden;}
        #box1,#box2,#box3 {width: 150px; height: 100px;}
        
        #box1{background-color: red; float: left; width: 180px; height: 300px;}
        #box2{background-color: blue; float: right; width: 300px; height: 300px;}
        #box3{background-color: yellow;float: left; width: 500px; height: 100px;} 
    </style>
</head>
<body>
    <div id="wrap"> <!--div#wrap>div*3#box${박스영역$}-->
        <div id="box1">박스영역1</div>
        <div id="box2">박스영역2</div>
        <div id="box3">박스영역3</div>
    </div>
</body>
</html>
