<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태이블 태그(표)</title>
</head>
<body>
    <!--table>tr*8>td*2-->
    <!--table>caption+tr*8>td*2-->

    <table border="1">
        <caption>홍차종류</caption>
        <tr>
            <th colspan="2">지역별 홍차</th>
            <!--<td></td>-->
        </tr>
        <tr>
            <th rowspan="3">중국</th>
            <td>정산소종</td>
        </tr>
        <tr>
            <!--<td></td>-->
            <td>기문</td>
        </tr>
        <tr>
            <!--<td></td>-->
            <td>운남</td>
        </tr>
        <tr>
            <th rowspan="4">인도 및 스리랑카</th>
            <td>아삼</td>
        </tr>
        <tr>
            <!--<td></td>-->
            <td>실론</td>
        </tr>
        <tr>
            <!--<td></td>-->
            <td>다질링</td>
        </tr>
        <tr>
            <!--<td></td>-->
            <td>닐기리</td>
        </tr>
    </table>

    <table border="1">
        <caption>시간표</caption>
        <tr>
            <th>요일</th>
            <th>월</th>
            <th>화</th>
            <th>수</th>
            <th>목</th>
            <th>금</th>
        </tr>
        <tr>
            <td>1교시</td>
            <td>국어</td>
            <td>영어</td>
            <td>수학</td>
            <td>과학</td>
            <td>사회</td>
        </tr>
            <td>2교시</td>
            <td>음악</td>
            <td>미술</td>
            <td>체육</td>
            <td>중어</td>
            <td>일어</td>
        <tr>

        </tr>
    </table>
    
</body>
</html>
