<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헤더코딩</title>
    <style>
        /*초기화*/
        *{margin: 0; padding: 0;}
        ul li{list-style: none;}
        /*헤더CSS*/
        #wrap{width: 1000px; margin: 0 auto;}
        header{overflow: hidden;}
        h1{float: left; color: red; font-family: 'Times New Roman', Times, serif; margin: 5px;}
        #top{float: right;}
        #top li{float: left; padding: 15px;}
        nav ul{overflow: hidden;}
        nav ul li{float: left; width:200px; box-sizing:border-box; border: 1px solid red; text-align: center; font-weight: bold; font-size: 20px;
        height: 50px; line-height: 50px; /*padding:10px*/ background-color: red; color: white;}
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>DAELIM</h1>
            <ul id="top">
                <li>로그인</li>
                <li>회원가입</li>
                <li>사이트맵</li>
            </ul>
        </header>
        <nav>
            <ul id="bottom">
                <li>학원정보</li>
                <li>교육정보</li>
                <li>갤러리</li>
                <li>자격증</li>
                <li>기업/대학교육</li>
            </ul>
        </nav>
    </div>
</body>
</html>
