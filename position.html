<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포지션</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        div{border: 5px solid #ccc; width: 500px; height: 500px;}
        p{width: 100px; height: 100px;}
        p:nth-child(1){background-color: red;}
        p:nth-child(2){background-color: blue; position:static;}
        p:nth-child(3){background-color: yellow;}
    </style>
</head>
<body>
    <h1>제목1위치</h1>
    <h1>제목2위치</h1>
    <h1>제목3위치</h1>
    <div>
        <p>박스1</p>
        <p>박스2</p>
        <p>박스3</p>
    </div>
</body>
</html>
